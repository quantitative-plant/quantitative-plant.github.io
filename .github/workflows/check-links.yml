name: Check external links
on:
  schedule: [{ cron: '0 6 1 * *' }]   # le 1er de chaque mois
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --accept 200..=299,403,429 'src/content/**/*.md'
          output: link-report.md
          fail: false
      - uses: peter-evans/create-issue-from-file@v5
        with:
          title: Monthly broken-link report
          content-filepath: link-report.md
          labels: maintenance, links
